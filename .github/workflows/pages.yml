name: Deploy Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  HUGO_VERSION: '0.159.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # needed for enableGitInfo
          # Required so the SSH submodule URL is used as-is in CI.
          ssh-key: ${{ secrets.OPENGIS_HUGO_THEME_SSH_KEY }}
          submodules: true # ensure theme is present

      - name: Setup Hugo
        run: |
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build Hugo site
        run: |
          if [[ ( "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ) || "${{ github.event_name }}" == "schedule" || ( "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref }}" == "refs/heads/main" ) ]]; then
            # Production build
            hugo --environment production --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}"
          else
            # Staging/preview build
            hugo --environment staging -D --baseURL "${{ steps.pages.outputs.base_url }}"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          preview: ${{ github.event_name == 'pull_request' }}
