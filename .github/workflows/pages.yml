name: Deploy Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, closed ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.159.1'
  PRODUCTION_URL: 'https://qfield.org/'
  PREVIEW_ROOT: 'https://qfield.org/pr-preview'
  DEPLOY_BRANCH: 'gh-pages'
  PAGES_MAX_BYTES: '1000000000'
  IMAGE_MAX_BYTES: '2097152'

jobs:
  image-audit:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check source image sizes
        run: scripts/audit-source-images.sh

  deploy-production:
    needs: image-audit
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # needed for enableGitInfo
          # Required so the SSH submodule URL is used as-is in CI.
          ssh-key: ${{ secrets.OPENGIS_HUGO_THEME_SSH_KEY }}
          submodules: true # ensure theme is present

      - name: Setup Hugo
        run: |
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          hugo version

      - name: Build production site
        run: hugo --environment production --gc --minify --cleanDestinationDir --baseURL "${PRODUCTION_URL}"

      - name: Check production site size
        run: |
          set -euo pipefail
          size="$(du -sb public | cut -f1)"
          echo "Production site size: ${size} bytes"
          if (( size > PAGES_MAX_BYTES )); then
            echo "::error::Production site is ${size} bytes, exceeding GitHub Pages' ${PAGES_MAX_BYTES}-byte artifact limit."
            largest_files="$(mktemp)"
            find public -type f -printf '%s %p\n' | sort -nr -o "${largest_files}"
            head -40 "${largest_files}"
            exit 1
          fi

      - name: Publish production site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deploy_dir="$(mktemp -d)"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "${remote_url}" "${DEPLOY_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${DEPLOY_BRANCH}" "${remote_url}" "${deploy_dir}"
          else
            git init "${deploy_dir}"
            git -C "${deploy_dir}" checkout -b "${DEPLOY_BRANCH}"
            git -C "${deploy_dir}" remote add origin "${remote_url}"
          fi

          rsync -a --delete --exclude '.git' --exclude 'pr-preview/' public/ "${deploy_dir}/"
          shopt -s nullglob
          for preview_dir in "${deploy_dir}/pr-preview"/pr-*; do
            pr_number="${preview_dir##*/pr-}"
            response_file="$(mktemp)"
            if curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              -o "${response_file}"; then
              if [[ "$(jq -r '.merged // false' "${response_file}")" == "true" ]]; then
                echo "Removing merged PR preview: pr-${pr_number}"
                rm -rf "${preview_dir}"
              fi
            else
              echo "::warning::Could not check PR #${pr_number}; keeping ${preview_dir}."
            fi
            rm -f "${response_file}"
          done
          shopt -u nullglob
          if [[ -d "${deploy_dir}/pr-preview" ]]; then
            find "${deploy_dir}/pr-preview" -type f -name '*.zip' -delete
          fi
          touch "${deploy_dir}/.nojekyll"

          deploy_size="$(du -sb "${deploy_dir}" --exclude='.git' | cut -f1)"
          echo "Pages branch size after production publish: ${deploy_size} bytes"
          if (( deploy_size > PAGES_MAX_BYTES )); then
            echo "::error::Pages branch would be ${deploy_size} bytes, exceeding GitHub Pages' ${PAGES_MAX_BYTES}-byte artifact limit."
            largest_files="$(mktemp)"
            find "${deploy_dir}" -path "${deploy_dir}/.git" -prune -o -type f -printf '%s %p\n' | sort -nr -o "${largest_files}"
            head -40 "${largest_files}"
            exit 1
          fi

          git -C "${deploy_dir}" config user.name "github-actions[bot]"
          git -C "${deploy_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${deploy_dir}" add -A

          if git -C "${deploy_dir}" diff --cached --quiet; then
            echo "Production site is already up to date."
          else
            git -C "${deploy_dir}" commit -m "Deploy production site from ${GITHUB_SHA}"
            git -C "${deploy_dir}" push origin "${DEPLOY_BRANCH}"
          fi

  deploy-preview:
    needs: image-audit
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PREVIEW_PATH: pr-preview/pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: ${{ format('{0}/pr-{1}/', 'https://qfield.org/pr-preview', github.event.pull_request.number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # needed for enableGitInfo
          # Required so the SSH submodule URL is used as-is in CI.
          ssh-key: ${{ secrets.OPENGIS_HUGO_THEME_SSH_KEY }}
          submodules: true # ensure theme is present

      - name: Setup Hugo
        run: |
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          hugo version

      - name: Build PR preview
        run: hugo --environment staging -D --cleanDestinationDir --baseURL "${PREVIEW_URL}"

      - name: Check PR preview size
        run: |
          set -euo pipefail

          find public -type f -name '*.zip' -delete

          size="$(du -sb public | cut -f1)"
          echo "PR preview size: ${size} bytes"
          if (( size > PAGES_MAX_BYTES )); then
            echo "::error::PR preview is ${size} bytes, exceeding GitHub Pages' ${PAGES_MAX_BYTES}-byte artifact limit."
            largest_files="$(mktemp)"
            find public -type f -printf '%s %p\n' | sort -nr -o "${largest_files}"
            head -40 "${largest_files}"
            exit 1
          fi

      - name: Publish PR preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deploy_dir="$(mktemp -d)"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "${remote_url}" "${DEPLOY_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${DEPLOY_BRANCH}" "${remote_url}" "${deploy_dir}"
          else
            git init "${deploy_dir}"
            git -C "${deploy_dir}" checkout -b "${DEPLOY_BRANCH}"
            git -C "${deploy_dir}" remote add origin "${remote_url}"
          fi

          shopt -s nullglob
          for preview_dir in "${deploy_dir}/pr-preview"/pr-*; do
            pr_number="${preview_dir##*/pr-}"
            response_file="$(mktemp)"
            if curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              -o "${response_file}"; then
              if [[ "$(jq -r '.merged // false' "${response_file}")" == "true" ]]; then
                echo "Removing merged PR preview: pr-${pr_number}"
                rm -rf "${preview_dir}"
              fi
            else
              echo "::warning::Could not check PR #${pr_number}; keeping ${preview_dir}."
            fi
            rm -f "${response_file}"
          done
          shopt -u nullglob
          if [[ -d "${deploy_dir}/pr-preview" ]]; then
            find "${deploy_dir}/pr-preview" -type f -name '*.zip' -delete
          fi
          mkdir -p "${deploy_dir}/${PREVIEW_PATH}"
          rsync -a --delete --exclude 'CNAME' public/ "${deploy_dir}/${PREVIEW_PATH}/"
          rm -f "${deploy_dir}/${PREVIEW_PATH}/CNAME"
          touch "${deploy_dir}/.nojekyll"
          if [[ -f CNAME ]]; then
            cp CNAME "${deploy_dir}/CNAME"
          fi

          deploy_size="$(du -sb "${deploy_dir}" --exclude='.git' | cut -f1)"
          echo "Pages branch size after preview publish: ${deploy_size} bytes"
          if (( deploy_size > PAGES_MAX_BYTES )); then
            echo "::error::Pages branch would be ${deploy_size} bytes, exceeding GitHub Pages' ${PAGES_MAX_BYTES}-byte artifact limit."
            largest_files="$(mktemp)"
            find "${deploy_dir}" -path "${deploy_dir}/.git" -prune -o -type f -printf '%s %p\n' | sort -nr -o "${largest_files}"
            head -40 "${largest_files}"
            exit 1
          fi

          git -C "${deploy_dir}" config user.name "github-actions[bot]"
          git -C "${deploy_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${deploy_dir}" add -A

          if git -C "${deploy_dir}" diff --cached --quiet; then
            echo "PR preview is already up to date."
          else
            git -C "${deploy_dir}" commit -m "Deploy preview for PR #${{ github.event.pull_request.number }}"
            git -C "${deploy_dir}" push origin "${DEPLOY_BRANCH}"
          fi

      - name: Comment PR preview URL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENTS_URL: ${{ github.event.pull_request.comments_url }}
        run: |
          set -euo pipefail

          marker="<!-- qfield-pr-preview -->"
          body="$(printf '%s\nPR preview: %s' "${marker}" "${PREVIEW_URL}")"

          comments="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${COMMENTS_URL}?per_page=100")"
          comment_id="$(jq -r --arg marker "${marker}" '.[] | select(.user.type == "Bot" and (.body | contains($marker))) | .id' <<< "${comments}" | tail -n 1)"
          payload="$(jq -n --arg body "${body}" '{body: $body}')"

          if [[ -n "${comment_id}" ]]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -d "${payload}"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${COMMENTS_URL}" \
              -d "${payload}"
          fi

  cleanup-preview:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PREVIEW_PATH: pr-preview/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Remove PR preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deploy_dir="$(mktemp -d)"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if ! git ls-remote --exit-code --heads "${remote_url}" "${DEPLOY_BRANCH}" >/dev/null 2>&1; then
            echo "No ${DEPLOY_BRANCH} branch exists; nothing to clean up."
            exit 0
          fi

          git clone --depth 1 --branch "${DEPLOY_BRANCH}" "${remote_url}" "${deploy_dir}"
          rm -rf "${deploy_dir}/${PREVIEW_PATH}"

          git -C "${deploy_dir}" config user.name "github-actions[bot]"
          git -C "${deploy_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${deploy_dir}" add -A

          if git -C "${deploy_dir}" diff --cached --quiet; then
            echo "No preview files to remove."
          else
            git -C "${deploy_dir}" commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
            git -C "${deploy_dir}" push origin "${DEPLOY_BRANCH}"
          fi

      - name: Comment PR preview removal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENTS_URL: ${{ github.event.pull_request.comments_url }}
        run: |
          set -euo pipefail

          marker="<!-- qfield-pr-preview -->"
          body="$(printf '%s\nPR preview removed after this pull request was closed.' "${marker}")"

          comments="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${COMMENTS_URL}?per_page=100")"
          comment_id="$(jq -r --arg marker "${marker}" '.[] | select(.user.type == "Bot" and (.body | contains($marker))) | .id' <<< "${comments}" | tail -n 1)"

          if [[ -z "${comment_id}" ]]; then
            exit 0
          fi

          payload="$(jq -n --arg body "${body}" '{body: $body}')"
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
            -d "${payload}"
