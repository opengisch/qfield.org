{{ define "main" }}
<article class="newsletter py-5">
  <div class="container">

    {{ with .Params.hero.image }}
    <div class="newsletter__banner text-center mb-4 {{ if $.Params.hero.background }}newsletter__banner--bg{{ end }}"
      {{ if $.Params.hero.background }}
      style="background-image: url('{{ $.Params.hero.background }}');"
      {{ end }}>
      <img src="{{ . }}" alt="{{ $.Title }}" class="img-fluid" />
    </div>
    {{ end }}

    <header class="newsletter__header text-center mx-auto mb-5">
      <h1 class="display-9 mb-3">{{ .Params.hero.headline | default .Title | safeHTML }}</h1>
      {{ with .Params.hero.sub }}
      <p class="lead text-muted">{{ . }}</p>
      {{ end }}
    </header>

    <div class="row justify-content-center">
      <div class="col">
        <div class="content newsletter__content">
          {{ .Content }}
        </div>
      </div>
    </div>

  </div>
</article>
{{ end }}
