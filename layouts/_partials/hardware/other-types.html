{{- /* Cross-links to the other hardware tiers. Expects a slice of link dicts (title, description, url, text). */ -}}
{{- $links := . -}}
{{ if $links }}
  <section class="py-5 border-top bg-body-tertiary">
    <div class="container">
      <h2 class="h4 mb-4">Other supported devices</h2>
      <div class="row row-cols-1 row-cols-md-2 g-4">
        {{ range $links }}
          {{ with . }}
            <div class="col">
              <article class="card h-100">
                <div class="card-body d-flex flex-column">
                  <h3 class="h5">{{ .title }}</h3>
                  <p class="text-muted flex-grow-1">{{ .description }}</p>
                  <a class="btn btn-outline-primary mt-auto align-self-start" href="{{ partial "url.html" (dict "url" .url) }}">{{ .text }}</a>
                </div>
              </article>
            </div>
          {{ end }}
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
