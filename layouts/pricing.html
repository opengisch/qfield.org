{{ define "main" }}
{{ with .Params.hero }}
<div class="hw-page">
  <section class="hw-hero" aria-labelledby="hero-heading">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-lg-6">
          <h1 id="hero-heading" class="hw-hero-title mb-4">{{ .title }}<br><span>{{ .highlight }}</span></h1>
          {{ with .lead }}<p class="lead mb-4">{{ . | safeHTML }}</p>{{ end }}
          {{ with .cta }}
          <a href="{{ partial "url.html" (dict "url" .url) }}" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-download me-1" aria-hidden="true"></i> {{ .text }}
          </a>
          {{ end }}
        </div>
        <div class="col-lg-6 d-none d-lg-block">
          <div class="hw-feature-tile">
            <img src="{{ "images/qfield_green_logo.svg" | relURL }}" alt="QField" loading="eager">
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
{{ end }}
<article class="pricing-page pt-5">
  <div class="container">
    {{ .Content }}
  </div>
</article>
{{ end }}
