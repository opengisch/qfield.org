{{ define "main" }}
<div class="error-page text-center">
  <div class="container">
    <div class="row">
      <div class="col">
        <img src="{{ "images/sad_nyuki.svg" | relURL }}" alt="Sad Nyuki mascot" class="error-image">
        <h1 class="error-title">404 - Page Not Found</h1>
        <p class="error-description">
          We're sorry, but the page you're looking for doesn't exist or has been moved.
        </p>
        
        <div class="error-actions">
          <a href="{{ partial "url.html" (dict "url" "/#highlights") }}" class="btn btn-primary">
            <i class="fas fa-home"></i> QField Highlights
          </a>
          <a href="{{ partial "url.html" (dict "url" "/success-stories/") }}" class="btn btn-secondary">
            <i class="fas fa-star"></i> Success Stories
          </a>
          <a href="https://docs.qfield.org" class="btn btn-secondary" target="_blank">
            <i class="fas fa-book"></i> Documentation
          </a>
          <a href="{{ partial "url.html" (dict "url" "/support-us/") }}" class="btn btn-secondary">
            <i class="fas fa-heart"></i> Support QField
          </a>
          <a href="{{ partial "url.html" (dict "url" "/partner/") }}" class="btn btn-secondary">
            <i class="fas fa-handshake"></i> Partner Programs
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var p = location.pathname;

  // Only handle /docs URLs for legacy redirect
  if (!/^\/docs(?:\/|$)/i.test(p)) return;

  // Extract last meaningful segment; drop .html; skip "index"
  p = p.replace(/\/+$/, '');
  var parts = p.split('/');
  var last = parts.pop() || '';
  if (/^index(?:\.html)?$/i.test(last)) last = parts.pop() || '';
  var slug = (last || '').replace(/\.html$/i, '');

  var dest = slug
    ? 'https://docs.qfield.org/?q=' + encodeURIComponent(slug)
    : 'https://docs.qfield.org/';

  location.replace(dest);
})();
</script>
{{ end }}
