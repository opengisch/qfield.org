# QField Native section (/hardware/#native)
native:
  title: "QField Native devices"
  intro:
    description: |
      QField Native devices connect to QField using its built-in NTRIP client and NMEA parser — no extra background app is required to receive high-accuracy positioning.
    details: |
      QField implements open, standard protocols that these devices use directly: **Bluetooth SPP** (Android), **BLE** (Android/iOS), **TCP** (Android/iOS) and **UDP** (Android). Manufacturer apps can still be used for initial setup or firmware updates. This tier does not include ongoing compatibility guarantees — for verified compatibility on every release, see our [QField Certified devices](#certified).

# Works with page (/hardware/works-with/)
works_with:
  title: "Works with QField devices"
  intro:
    description: |
      These devices have been tested and reported as functional by their manufacturers or the community.
    details: |
      Compatibility is self-reported and is not verified by the QField team.
