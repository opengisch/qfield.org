title: "QField ready devices"

# Shown above every device list.
note: "By using the *Buy now* links below you are directly supporting the development of QField."

# Index page (/hardware/) — QField Certified devices
intro:
  description: |
    QField works with a wide range of GNSS receivers, rugged tablets and smartphones. To help you pick the right device, we group supported hardware into three levels.
  details: |
    [**QField Certified**](#certified) devices are tested by our team before every major QField release, guaranteeing reliable, out-of-the-box compatibility. [**QField Native**](#native) devices connect through QField's built-in NTRIP client and NMEA parser over open, standard protocols. [**Works with QField**](/hardware/works-with/) devices are tested and reported by their manufacturers or the community.
  cta:
    text: "Join the program"
    url: "https://forms.clickup.com/2192114/f/22wqj-30275/PL7WYHF6T67DE484DE"

certified:
  title: "QField Certified devices"
  description: |
    Tested by our team on physical hardware before every major QField release, so you get reliable, guaranteed compatibility out of the box. Every QField Certified device is also QField Native, so it connects through the same open, standard protocols and keeps the same smooth, app-free setup.

