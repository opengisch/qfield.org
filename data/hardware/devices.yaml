# All QField hardware devices in one place.
# `level` sets the certification tier and where the device is shown:
#   certified   -> /hardware/          (card, needs image/description)
#   native      -> /hardware/native/   (table row)
#   works-with  -> /hardware/works-with/ (table row)
#
# Card fields (certified): name, image{src,alt}, description, details, link{url,text}
# Table fields (native/works-with): brand, name, qfield_version, android, ios,
#   windows, macos, linux, notes, date, link{url,text}
# Platform cells: "x" (supported), "-" (not supported), "?" (unknown) or leave empty.

# --- QField Certified ---------------------------------------------------------

