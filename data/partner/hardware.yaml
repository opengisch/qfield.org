# Hardware partners shown on /hardware-partners/.
# Same shape as partners.yaml; the `regions` field is not used here (no filter).
# `logo` and `modal` are optional — cards render fine without them.

- id: happy-survey
  name: Happy Survey
  logo:
    src: "images/partners/happy-mini-q.jpg"
    alt: "Happy Survey"
  description: |
    Swiss maker of the HAPPY MiniQ and HAPPY Mönch GNSS receivers — compact, high-precision positioning devices with IMU, built to work seamlessly with QField.
  website:
    url: "https://happysurvey.ch"

- id: samsung
  name: Samsung
  logo:
    src: "https://images.samsung.com/is/image/samsung/p6pim/uk/feature/165074157/uk-feature-tablets-540309214?$FB_TYPE_K_JPG$"
    alt: "Samsung"
  description: |
    Maker of the rugged Galaxy Tab Active and XCover series — MIL-STD-810H tablets and smartphones designed to keep QField running in the harshest field conditions.
  website:
    url: "https://www.samsung.com/business/"

