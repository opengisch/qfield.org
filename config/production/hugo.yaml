# Production environment configuration
# Optimized for performance, SEO, and security

# Production server headers
server:
  headers:
    - for: "/**"
      values:
        X-Frame-Options: "DENY"
        X-Content-Type-Options: "nosniff"
        Referrer-Policy: "strict-origin-when-cross-origin"
        Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
        Content-Security-Policy: "default-src 'self'; img-src 'self' data: https:; font-src 'self' data: https://use.typekit.net https://p.typekit.net https://cdnjs.cloudflare.com https://assets.brevo.com; style-src 'self' 'unsafe-inline' https://use.typekit.net https://p.typekit.net https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://sibforms.com https://*.sibforms.com https://assets.brevo.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://use.typekit.net https://cdn.jsdelivr.net https://sibforms.com https://*.sibforms.com https://assets.brevo.com https://static.brevo.com https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://docs.qfield.org https://community.qfield.org https://sibforms.com https://*.sibforms.com https://*.brevo.com https://*.cloudflare.com https://challenges.cloudflare.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src 'self' https://sibforms.com https://*.sibforms.com https://challenges.cloudflare.com; worker-src 'self' blob:; form-action 'self' https://sibforms.com https://*.sibforms.com;"

# Build settings for production
build:
  writeStats: true
  useResourceCacheWhen: "fallback"

# Production cache settings - longer TTL
caches:
  assets:
    dir: ":cacheDir/:project"
    maxAge: "8h"
  images:
    dir: ":cacheDir/:project"
    maxAge: "8h"
  modules:
    dir: ":cacheDir/:project"
    maxAge: "8h"

# Full minification for production
minify:
  disableCSS: false
  disableHTML: false
  disableJS: false
  disableJSON: false
  disableSVG: false
  disableXML: false
  minifyOutput: true
  tdewolff:
    css:
      version: 4  # Remove CSS2 compatibility for smaller size
      precision: 2
    html:
      keepComments: false
      keepSpecialComments: false
      keepDefaultAttrVals: false
      keepDocumentTags: true
      keepEndTags: true
      keepQuotes: false
      keepWhitespace: false
    js:
      keepVarNames: false
      precision: 2

# Production image settings - highest quality
imaging:
  quality: 85
  resampleFilter: "Lanczos"  # Best quality filter
  exif:
    includeFields: ""
    excludeFields: "GPS|Exif"  # Remove metadata for privacy/size
    disableDate: false
    disableLatLong: true

# Production-specific params
params:
  environment: "production"
  debug: false
  analytics: true
  serviceWorker: true
  
  # Performance budget
  performance:
    maxPageSize: "2MB"
    maxImageSize: "500KB"
    maxScriptSize: "1MB"
